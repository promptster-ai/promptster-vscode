name: CI

on:
  push:
    branches: [main]
  pull_request:
  # No nightly schedule. It was added after a fixture's `expiresAt` literal
  # passed on 2026-08-22 and turned the suite red with no one told; that
  # fixture is now relative to now, and in a repo that goes weeks without a
  # commit the nightly was re-testing an unchanged tree (24 runs, no news).
  # A test that depends on today's date has to fake the clock instead. To
  # re-check an idle tree on demand, run this workflow by hand.
  workflow_dispatch:

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        # No `version:` here — it is pinned by package.json `packageManager`,
        # and action-setup errors when both are set. One source, not two.

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -p ./ --noEmit

      - name: Tests
        run: pnpm exec vitest run

      # The automerge gate's decision test. It is what keeps REQUIRED_CHECKS
      # naming jobs that really exist — a required check that never reports is a
      # gate that never merges — so it runs inside a check the gate itself
      # requires. Node stdlib only; the scripts live at the repo root.
      - name: Automerge decision tests
        run: node --test scripts/__tests__/automerge-decision.test.mjs
